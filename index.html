<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Cameracal Guide Generator</title><link rel="stylesheet" href="style.css"></head>
<body><div class="app"><aside class="controls"><h1>Cameracal Guide Generator</h1><p>Select brand, model and genre, then edit the generated guide directly on the page.</p><label>Brand</label><select id="brand"><option>Canon</option><option>Nikon</option><option>Sony</option><option>OM System</option><option>Fujifilm</option></select><label>Camera Model</label><input id="model" value="EOS R5 Mark II"><label>Genre</label><select id="genre"><option>Safari & Wildlife</option><option>Birds in Flight</option><option>Motorsport</option><option>Aviation</option><option>Landscape</option><option>Wedding & Portrait</option><option>Macro</option></select><label>WhatsApp / Support Number</label><input id="phone" value="07438 797679"><label>Website</label><input id="website" value="www.cameracalservices.co.uk"><button onclick="generateGuide()">Generate / Refresh Guide</button><button onclick="window.print()">Print / Save as PDF</button><button onclick="downloadHTML()">Download Editable HTML</button><p class="note">When saving as PDF, enable background graphics and use minimum margins.</p></aside><main id="guide" class="guide"></main></div><script src="script.js"></script></body></html>
