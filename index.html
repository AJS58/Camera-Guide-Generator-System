<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cameracal Guide Builder V2</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<aside class="controls">
<h1>Cameracal Guide Builder V2</h1>
<p>Create a branded guide, edit it on-screen, swap images, remove pages, then print/save as PDF.</p>

<label>Brand</label>
<select id="brand">
<option>Canon</option><option>Nikon</option><option>Sony</option><option>OM System</option><option>Fujifilm</option>
</select>

<label>Camera Model</label>
<input id="model" value="EOS R5 Mark II">

<label>Genre</label>
<select id="genre">
<option>Safari & Wildlife</option><option>Birds in Flight</option><option>Motorsport</option><option>Aviation</option><option>Landscape</option><option>Wedding & Portrait</option><option>Macro</option>
</select>

<label>Theme</label>
<select id="theme">
<option value="dark">Premium Dark</option><option value="light">Clean White</option>
</select>

<label>Guide Length</label>
<select id="length">
<option value="12">12 Page Premium Guide</option><option value="6">6 Page Short Guide</option><option value="3">3 Page Quick Guide</option>
</select>

<label>WhatsApp / Support Number</label>
<input id="phone" value="07438 797679">

<label>Website</label>
<input id="website" value="www.cameracalservices.co.uk">

<button onclick="generateGuide()">Generate / Refresh Guide</button>
<button onclick="addCustomPage()">Add Blank Page</button>
<button onclick="window.print()">Print / Save as PDF</button>
<button onclick="downloadStandalone()">Download Editable HTML</button>

<hr>
<h2>Image Replacement</h2>
<p class="small">Upload an image, then click “Use Upload” on any image box.</p>
<input type="file" id="uploadImage" accept="image/*">

<p class="note">For PDF export, enable background graphics and use minimum margins.</p>
</aside>

<main>
<div id="guide" class="guide"></div>
</main>
</div>
<script src="script.js"></script>
</body>
</html>
